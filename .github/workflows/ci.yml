name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

env:
  # Docker requires lowercase repository names, and the GitHub repos are
  # named Tiketwar-* with a capital T, so github.repository cannot be used.
  IMAGE: ghcr.io/pepeuwu123/tiketwar-webui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SERVICE_URL: http://localhost:8080

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, tiketwar]
    steps:
      - name: deploy the pushed tag on the tiketwar VM
        working-directory: /opt/tiketwar
        run: |
          echo "${{ env.IMAGE }}:${{ needs.build.outputs.tag }}" > .deployed-tag
          docker compose pull || true
          docker compose up -d --remove-orphans
          docker compose ps
          curl -fsS --retry 10 --retry-delay 3 http://localhost:3000/
